<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'">
  <title>Spotify Widget</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="themes.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
      <symbol id="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></symbol>
      <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></symbol>
      <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><path d="M9 1h6v2H9zM11 14h2V8h-2zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.962 8.962 0 0 0 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></symbol>
    </defs>
  </svg>

  <div id="card">
    <div id="bg"></div>
    <div id="shade"></div>

    <!-- Logowanie -->
    <section id="login" hidden>
      <div class="top">
        <span class="grip drag" title="Przytrzymaj i przeciągnij, żeby przesunąć"><svg><use href="#i-grip"/></svg></span>
        <span class="brand drag"><span class="dot"></span>Spotify Widget</span>
        <span class="spacer drag"></span>
        <button class="ic nodrag" id="close1" title="Ukryj"><svg><use href="#i-close"/></svg></button>
      </div>
      <p class="hint">Wklej <b>Client ID</b> z <a href="#" id="devlink">developer.spotify.com</a> i dodaj tam Redirect URI:</p>
      <code id="redirect" title="Kliknij, żeby skopiować"></code>
      <div class="row">
        <input id="clientId" class="nodrag" placeholder="Client ID" spellcheck="false" autocomplete="off">
        <button id="loginBtn" class="primary nodrag">Zaloguj</button>
      </div>
      <div id="loginErr" class="err"></div>
    </section>

    <!-- Player -->
    <section id="player" hidden>
      <div class="top">
        <span class="grip drag" title="Przytrzymaj i przeciągnij, żeby przesunąć"><svg><use href="#i-grip"/></svg></span>
        <span class="brand drag"><span class="dot"></span>Spotify</span>
        <span class="eq" id="eq"><i></i><i></i><i></i><i></i></span>
        <input id="filter" class="nodrag" placeholder="Szukaj lub wklej link…" spellcheck="false" autocomplete="off">
        <span id="trTitle" class="trtitle" hidden></span>
        <span class="spacer drag"></span>
        <button class="ic nodrag" id="pomoBtn" title="Pomodoro" hidden><svg><use href="#i-clock"/></svg></button>
        <button class="ic nodrag" id="setBtn" title="Wygląd i ustawienia"><svg><use href="#i-gear"/></svg></button>
        <button class="ic nodrag" id="plBtn" title="Playlisty"><svg class="s-list"><use href="#i-list"/></svg><svg class="s-back"><use href="#i-back"/></svg></button>
        <button class="ic nodrag" id="close2" title="Ukryj do zasobnika"><svg><use href="#i-close"/></svg></button>
      </div>

      <div class="now">
        <div class="art-wrap"><img id="art" class="art" alt=""><div class="art-ph"><svg><use href="#i-note"/></svg></div></div>
        <div class="meta">
          <div id="title" class="title"><span>Nic nie gra</span></div>
          <div id="artist" class="artist">Włącz coś albo wybierz playlistę</div>
        </div>
      </div>

      <div class="progress nodrag">
        <span id="tcur">0:00</span>
        <div id="bar"><div id="track"><div id="fill"></div></div></div>
        <span id="tdur">0:00</span>
      </div>

      <div class="controls nodrag">
        <div class="side left">
          <button class="ic" id="shuffle" title="Losowo"><svg><use href="#i-shuffle"/></svg></button>
          <button class="ic" id="heart" title="Dodaj do polubionych" disabled><svg class="h-off"><use href="#i-heart"/></svg><svg class="h-on"><use href="#i-heart-fill"/></svg></button>
        </div>
        <div class="center">
          <button class="ic big" id="prev" title="Poprzedni"><svg><use href="#i-prev"/></svg></button>
          <button class="play" id="toggle" title="Odtwórz / pauza">
            <svg class="p-play"><use href="#i-play"/></svg>
            <svg class="p-pause"><use href="#i-pause"/></svg>
          </button>
          <button class="ic big" id="next" title="Następny"><svg><use href="#i-next"/></svg></button>
        </div>
        <div class="side right"><div class="volbox"><svg><use href="#i-vol"/></svg><input id="vol" type="range" min="0" max="100" title="Głośność"></div></div>
      </div>

      <div id="plPanel"><div id="plList"></div><div id="plName">Najedź na okładkę, aby zobaczyć nazwę</div></div>
      <div id="trPanel"><div id="trList"></div></div>
    </section>

    <!-- Pomodoro -->
    <section id="pomo" hidden>
      <div class="top">
        <span class="grip drag" title="Przytrzymaj i przeciągnij, żeby przesunąć"><svg><use href="#i-grip"/></svg></span>
        <span class="brand drag"><span class="dot"></span>Pomodoro</span>
        <span class="spacer drag"></span>
        <button class="ic nodrag" id="pomoBack" title="Wróć do muzyki"><svg><use href="#i-note"/></svg></button>
        <button class="ic nodrag" id="setBtn2" title="Wygląd i ustawienia"><svg><use href="#i-gear"/></svg></button>
        <button class="ic nodrag" id="close3" title="Ukryj do zasobnika"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="pomo-modes nodrag">
        <button class="pm" data-mode="focus">Focus</button>
        <button class="pm" data-mode="short"><span class="long">Krótka przerwa</span><span class="shortl">Krótka</span></button>
        <button class="pm" data-mode="long"><span class="long">Długa przerwa</span><span class="shortl">Długa</span></button>
      </div>
      <div class="pomo-body">
        <div class="ring">
          <svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="44"/><circle id="ringFg" class="fg" cx="50" cy="50" r="44"/></svg>
          <span id="pomoTime">25:00</span>
        </div>
        <div class="pomo-side">
          <div class="pomo-info"><div class="pdots" id="pomoDots"></div><div class="plabel" id="pomoLabel">Sesja 1/4</div></div>
          <div class="pomo-ctl nodrag">
            <button class="ic big" id="pReset" title="Zacznij blok od nowa"><svg><use href="#i-reset"/></svg></button>
            <button class="play" id="pToggle" title="Start / pauza"><svg class="pp-play"><use href="#i-play"/></svg><svg class="pp-pause"><use href="#i-pause"/></svg></button>
            <button class="ic big" id="pSkip" title="Pomiń do następnego bloku"><svg><use href="#i-next"/></svg></button>
          </div>
        </div>
      </div>
    </section>
    <div id="status" class="toast"></div>
  </div>
  <script src="sound.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
