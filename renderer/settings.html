<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'">
  <title>Spotify Widget – Wygląd</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header>
    <h1>Wygląd</h1>
    <p>Wybierz preset i rozmiar panelu. Zmiany widać od razu na pulpicie.</p>
  </header>

  <section class="controls">
    <div class="group">
      <span class="label">Rozmiar</span>
      <div class="seg" id="layoutSeg">
        <button data-layout="standard">Standardowy</button>
        <button data-layout="compact">Minimalistyczny</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Podgląd</span>
      <div class="seg" id="modeSeg">
        <button data-mode="player">Odtwarzacz</button>
        <button data-mode="playlists">Playlisty</button>
      </div>
    </div>
  </section>

  <main id="grid"></main>
  <script src="settings.js"></script>
</body>
</html>
